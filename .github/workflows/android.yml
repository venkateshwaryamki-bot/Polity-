name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.CIVIX_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Build debug APK (install on your phone to test)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PversionCode=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: civix-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      # Signed release for Google Play. Runs only when the signing secrets exist.
      - name: Decode upload keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.CIVIX_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/civix-upload.jks"

      - name: Build signed release bundle (.aab) and APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          CIVIX_KEYSTORE_PATH: ${{ runner.temp }}/civix-upload.jks
          CIVIX_KEYSTORE_PASSWORD: ${{ secrets.CIVIX_KEYSTORE_PASSWORD }}
          CIVIX_KEY_ALIAS: ${{ secrets.CIVIX_KEY_ALIAS }}
          CIVIX_KEY_PASSWORD: ${{ secrets.CIVIX_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with:
          name: civix-release-for-play-store
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
